name: mylaws
description: "MyLaws - Bangladesh Legal Information and Document Preparation Assistant"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Localization & Internationalization
  intl: ^0.20.2

  # Storage & Database (SQLite + FTS5)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # PDF & Document Generation
  pdf: ^3.10.8
  printing: ^5.13.2

  # Platform & Helpers
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  crypto: ^3.0.3
  http: ^1.2.1
  # Authentication & Google Sign-In
  google_sign_in: ^6.2.1
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/licenses/
    - assets/corpus/
    - contract/fixtures/

  fonts:
    - family: AnekBangla
      fonts:
        - asset: assets/fonts/anek_400.ttf
          weight: 400
        - asset: assets/fonts/anek_500.ttf
          weight: 500
        - asset: assets/fonts/anek_600.ttf
          weight: 600

    - family: Hind
      fonts:
        - asset: assets/fonts/hind_regular.ttf
          weight: 400
        - asset: assets/fonts/hind_medium.ttf
          weight: 500
        - asset: assets/fonts/hind_semibold.ttf
          weight: 600

    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader_medium.ttf
          weight: 500
        - asset: assets/fonts/newsreader_semibold.ttf
          weight: 600

    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/bangla.ttf
          weight: 400
